    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/cambiartexto.js"></script>
    <script src="js/glb.js"></script>
    <script>
      const hamburger = document.querySelector(".hamburguesa");
      const navLinks = document.querySelector(".nav-links");

      hamburger.addEventListener("click", () => {
        navLinks.classList.toggle("active");
      });
      const model = document.querySelector("#miModelo");

      gsap
        .timeline({
          scrollTrigger: {
            trigger: ".contenedor-glb",
            start: "top bottom", 
            end: "bottom top", 
            scrub: 1, 
          },
        })
        .fromTo(
          model,
          { scale: 0.5, opacity: 0.3 }, 
          { scale: 1.8, opacity: 1, duration: 1 }, 
        )
        .to(
          model,
          { scale: 0.5, opacity: 0.3, duration: 1 }, 
        );
    </script>
